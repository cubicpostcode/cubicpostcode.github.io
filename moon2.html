<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Trafalgar Sky 2</title><style>html,body{margin:0;min-height:100%;background:#07111f;color:#eef4fb;font-family:system-ui,sans-serif}body{display:grid;place-items:center}main{text-align:center;padding:2rem}.spinner{width:42px;height:42px;margin:0 auto 1rem;border:4px solid #ffffff2b;border-top-color:#79b8ff;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#a9b7c9}</style></head><body><main><div class="spinner"></div><div>Loading Trafalgar Sky 2…</div><small>Preparing the clean Trafalgar Square reconstruction…</small></main><script>
(async()=>{
 if(!('DecompressionStream' in window))throw new Error('Please use a current version of Chrome, Edge, Firefox or Safari.');
 const base='moon2-app18-86cf522ed83d/',count=2,parts=new Array(count),queue=Array.from({length:count},(_,i)=>i);
 await Promise.all(Array.from({length:Math.min(4,count)},async()=>{while(queue.length){const i=queue.shift(),r=await fetch(`${base}part-${String(i+1).padStart(3,'0')}.b64?v=86cf522ed83d`,{cache:'force-cache'});if(!r.ok)throw new Error(`Unable to load application part ${i+1}.`);parts[i]=(await r.text()).trim();}}));
 const encoded=parts.join('');if(!encoded||encoded.length%4)throw new Error('The application payload did not load completely.');
 const binary=atob(encoded),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();
 const landmarkCalls=`    // Clean architectural reconstruction. The damaged imported mesh is deliberately not rendered.\n    buildGround();\n    buildNationalGallery();\n    buildStMartin();\n    buildNelsonColumn();\n    buildFountain(-51, 5);\n    buildFountain(51, 5);\n    buildAdmiraltyArch();\n    buildSurroundingBuildings();\n    buildTreesAndLamps();\n\n`;
 const cleanModelReady=`    detailedRoot.visible=false;\n    setModelProgress(100,'Ready · clean architectural reconstruction');\n    modelLoading.querySelector('.model-loading-title').textContent='Trafalgar Square ready';\n    modelLoading.classList.add('done');\n    setTimeout(()=>modelLoading.remove(),500);`;
 const worldOpacityBlock=`      <div class="timeline">
        <span class="small">World opacity</span>
        <input id="worldOpacity" type="range" min="0" max="100" step="1" value="100" aria-label="World opacity">
        <span id="worldOpacityLabel" class="small">100%</span>
      </div>`;
 const celestialScaleControls=`
      <div class="timeline">
        <span class="small">Sun display size</span>
        <input id="sunDisplayScale" type="range" min="1" max="5" step="0.1" value="1" aria-label="Sun display size multiplier" oninput="document.getElementById('sunDisplayScaleLabel').textContent=Number(this.value).toFixed(1)+'×';window.Trafalgar3D?.setSunScale(this.value)">
        <span id="sunDisplayScaleLabel" class="small">1.0×</span>
      </div>
      <div class="timeline">
        <span class="small">Moon display size</span>
        <input id="moonDisplayScale" type="range" min="1" max="5" step="0.1" value="1" aria-label="Moon display size multiplier" oninput="document.getElementById('moonDisplayScaleLabel').textContent=Number(this.value).toFixed(1)+'×';window.Trafalgar3D?.setMoonScale(this.value)">
        <span id="moonDisplayScaleLabel" class="small">1.0×</span>
      </div>`;
 const scaleFunctions=`    function setSunScale(value) {
      const factor=Math.max(1,Math.min(5,Number(value)||1));
      sun.scale.setScalar(factor);
      return factor;
    }

    function setMoonScale(value) {
      const factor=Math.max(1,Math.min(5,Number(value)||1));
      moon.scale.setScalar(factor);
      return factor;
    }

`;
 html=html.replace('<title>Trafalgar Sky 2 — Detailed Trafalgar Square</title>','<title>Trafalgar Sky 2 — Clean Trafalgar Square Reconstruction</title>')
   .replace('Detailed model edition · interactive topocentric ephemeris','Clean architectural edition · interactive topocentric ephemeris')
   .replace('Loading detailed Trafalgar Square model…','Loading clean Trafalgar Square reconstruction…')
   .replace('Loading detailed Trafalgar Square…','Loading clean Trafalgar Square reconstruction…')
   .replace(worldOpacityBlock,worldOpacityBlock+celestialScaleControls)
   .replace('    function makeLabel(text) {',landmarkCalls+'    function makeLabel(text) {')
   .replace('    loadDetailedModel();',cleanModelReady)
   .replace('This edition uses a heavily optimised, application-integrated Trafalgar Square model licensed through Fab. The original FBX is not distributed.','This edition currently uses a clean application-built architectural reconstruction while the licensed source-model conversion is corrected. The original FBX is not distributed.')
   .replace('The 3D scene uses Three.js 0.185.1 and a heavily optimised 526,055-triangle Trafalgar Square model licensed through Fab. The original source files are not distributed.','The 3D scene uses Three.js 0.185.1 and a clean application-built Trafalgar Square reconstruction. A licensed source model is being converted separately; the original source files are not distributed.')
   .replace('controls.target.set(0, 18, 0);','controls.target.set(0, 22, 20);')
   .replace('controls.maxPolarAngle = Math.PI * 0.78;','controls.maxPolarAngle = Math.PI * 0.96;')
   .replace('controls.target.set(0,18,0);\n      camera.position.set(245,155,-285);','controls.target.set(0,22,20);\n      camera.position.set(0,75,-170);')
   .replace('controls.maxPolarAngle=Math.PI*.78;','controls.maxPolarAngle=Math.PI*.96;')
   .replace('controls.target.set(0,0,0);\n      camera.position.set(0,520,-8);','controls.target.set(0,5,15);\n      camera.position.set(0,360,-30);')
   .replace('controls.target.set(0,20,35);\n      camera.position.set(0,12,-205);','controls.target.set(0,16,45);\n      camera.position.set(0,10,-145);')
   .replace('const radius=340;\n      controls.target.set(0,20,0);\n      camera.position.set(-Math.sin(az)*radius,82,-Math.cos(az)*radius);','const radius=190;\n      controls.target.set(0,22,20);\n      camera.position.set(-Math.sin(az)*radius,72,20-Math.cos(az)*radius);')
   .replace("const fill = new THREE.AmbientLight(0xffffff,.18);\n    scene.add(fill);","const fill = new THREE.AmbientLight(0xffffff,.18);\n    scene.add(fill);\n    const nightKey = new THREE.DirectionalLight(0x91b8ff,.36);\n    nightKey.position.set(-180,260,-130);\n    nightKey.castShadow=true;\n    scene.add(nightKey);")
   .replace("worldSun.intensity = mode==='day' ? 0.55+2.45*daylight : Math.max(0,daylight*.25);","worldSun.intensity = mode==='day' ? 0.55+2.45*daylight : 0.08;")
   .replace("hemisphere.intensity = mode==='day' ? 0.85+daylight*.55 : 0.17;","hemisphere.intensity = mode==='day' ? 0.85+daylight*.55 : 0.42;")
   .replace("fill.intensity = mode==='day' ? 0.12+daylight*.18 : 0.06;","fill.intensity = mode==='day' ? 0.12+daylight*.18 : 0.16;\n      nightKey.intensity = mode==='night' ? 0.36 : 0.08;")
   .replace("renderer.toneMappingExposure = mode==='day' ? 1.05 : 1.35;","renderer.toneMappingExposure = mode==='day' ? 1.05 : 1.55;")
   .replace('    function setWorldVisible(show) {',scaleFunctions+'    function setWorldVisible(show) {')
   .replace('    window.Trafalgar3D={update,setWorldOpacity,setWorldVisible,setLightMode,resetView,aerialView,groundView,setHeading,setFov,nudgeView,focusBody,resize};',
`    window.Trafalgar3D={update,setWorldOpacity,setWorldVisible,setLightMode,resetView,aerialView,groundView,setHeading,setFov,nudgeView,focusBody,resize,setSunScale,setMoonScale};
    setSunScale(document.getElementById('sunDisplayScale')?.value||1);
    setMoonScale(document.getElementById('moonDisplayScale')?.value||1);`);
 document.open();document.write(html);document.close();
})().catch(error=>{document.body.innerHTML=`<main><h1>Unable to load Trafalgar Sky 2</h1><p>${String(error.message||error)}</p><button onclick="location.reload()">Reload</button></main>`;});
</script></body></html>
