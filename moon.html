<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Trafalgar Sky</title>
  <style>
    html,body{margin:0;min-height:100%;background:#07111f;color:#eef4fb;font-family:system-ui,sans-serif}
    body{display:grid;place-items:center}
    main{text-align:center;padding:2rem}
    .spinner{width:42px;height:42px;margin:0 auto 1rem;border:4px solid #ffffff2b;border-top-color:#79b8ff;border-radius:50%;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    small{color:#a9b7c9}
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <div>Loading Trafalgar Sky…</div>
    <small>Preparing the interactive 3D scene…</small>
  </main>
  <script src="moon-assets/data-01.js"></script>
  <script src="moon-assets/data-02.js"></script>
  <script src="moon-assets/data-03.js"></script>
  <script src="moon-assets/data-04.js"></script>
  <script src="moon-assets/data-05.js"></script>
  <script src="moon-assets/data-06.js"></script>
  <script>
    (async () => {
      if (!("DecompressionStream" in window)) {
        throw new Error("Please open this page in a current version of Chrome, Edge, Firefox or Safari.");
      }
      const encoded = window.__TRAFALGAR_GZ || "";
      const bytes = Uint8Array.from(atob(encoded), character => character.charCodeAt(0));
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
      const html = await new Response(stream).text();
      delete window.__TRAFALGAR_GZ;
      document.open();
      document.write(html);
      document.close();
    })().catch(error => {
      document.body.innerHTML = `<main><h1>Unable to load Trafalgar Sky</h1><p>${String(error.message || error)}</p></main>`;
    });
  </script>
</body>
</html>
