name: Build Moon2 with direct verified assets

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-moon2-direct-assets.yml
      - moon2-debug-source.html
      - moon2-model18-c98efce62cd7/**
      - moon2-repair-54eab612513d/**
      - moon2-model18-part009-split-v1/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Validate model and build clean app bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import json
          import re
          import shutil
          import struct

          app_version = 'direct-v19-20260729-2315'
          app_dir = Path('moon2-app19-direct-v19')
          base_dir = Path('moon2-model18-c98efce62cd7')
          repair_dir = Path('moon2-repair-54eab612513d')

          source_lists = {
              1: ['moon2-model18-c98efce62cd7/part-001.b64'],
              2: [f'moon2-repair-54eab612513d/p002-{i:02d}.b64' for i in range(1, 4)],
              3: ['moon2-model18-c98efce62cd7/part-003.b64'],
              4: [f'moon2-repair-54eab612513d/p004-{i:02d}.b64' for i in range(1, 4)],
              5: [f'moon2-repair-54eab612513d/p005-{i:02d}.b64' for i in range(1, 4)],
              6: ['moon2-model18-c98efce62cd7/part-006.b64'],
              7: ['moon2-model18-c98efce62cd7/part-007.b64'],
              8: ['moon2-model18-c98efce62cd7/part-008.b64'],
              9: ['moon2-model18-part009-split-v1/part-001.b64'],
          }

          # Validate the exact assets the browser will fetch.
          decoded_parts = []
          part_report = []
          for number in range(1, 10):
              paths = [Path(path) for path in source_lists[number]]
              encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in paths)
              if not encoded or len(encoded) % 4:
                  raise RuntimeError(f'Part {number} has invalid Base64 length {len(encoded)}')
              decoded = base64.b64decode(encoded, validate=True)
              decoded_parts.append(decoded)
              part_report.append({
                  'number': number,
                  'sources': source_lists[number],
                  'base64Characters': len(encoded),
                  'decodedBytes': len(decoded),
              })

          compressed_model = b''.join(decoded_parts)
          raw_model = gzip.decompress(compressed_model)
          if raw_model[:8] != b'TRAFVAR1':
              raise RuntimeError(f'Unexpected model magic {raw_model[:8]!r}')
          header_length = struct.unpack_from('<I', raw_model, 8)[0]
          header = json.loads(raw_model[12:12 + header_length])

          html = Path('moon2-debug-source.html').read_text(encoding='utf-8')
          old_constants = """    const MODEL_VERSION = 'c98efce62cd7';
    const MODEL_SEGMENT_COUNT = 9;
    const MODEL_SEGMENT_BASE = 'moon2-model18-c98efce62cd7/';"""
          source_json = json.dumps(source_lists, separators=(',', ':'))
          new_constants = f"""    const MODEL_VERSION = '{app_version}';
    const MODEL_SEGMENT_COUNT = 9;
    const MODEL_SEGMENT_SOURCES = {source_json};"""
          if old_constants not in html:
              raise RuntimeError('Could not locate model constants in deployed source.')
          html = html.replace(old_constants, new_constants, 1)

          replacement = r'''    async function fetchModelText(path, label) {
      let lastError;
      for (let attempt=1; attempt<=4; attempt++) {
        try {
          const separator = path.includes('?') ? '&' : '?';
          const response = await fetch(`${path}${separator}v=${MODEL_VERSION}`, {cache:'no-store'});
          if (!response.ok) throw new Error(`${label} returned HTTP ${response.status}.`);
          return (await response.text()).trim();
        } catch (error) {
          lastError = error;
          if (attempt < 4) await new Promise(resolve => setTimeout(resolve, 350 * attempt));
        }
      }
      throw lastError || new Error(`${label} failed.`);
    }

    async function loadSegment(index) {
      const number = index + 1;
      const sources = MODEL_SEGMENT_SOURCES[number];
      if (!sources?.length) throw new Error(`No source configured for model segment ${number}.`);
      const texts = [];
      for (const path of sources) texts.push(await fetchModelText(path, `Model segment ${number}`));
      const encoded = texts.join('');
      if (!encoded || encoded.length % 4) throw new Error(`Model segment ${number} is incomplete.`);
      let binary;
      try { binary = atob(encoded); }
      catch (error) { throw new Error(`Model segment ${number} is not valid Base64.`); }
      const bytes = new Uint8Array(binary.length);
      for (let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
      return bytes;
    }

    async function loadModelSegments'''

          pattern = re.compile(r"    async function loadSegment\(index\) \{.*?\n    \}\n\n    async function loadModelSegments", re.S)
          html, count = pattern.subn(replacement, html, count=1)
          if count != 1:
              raise RuntimeError(f'Expected to replace one loadSegment function, replaced {count}.')

          if app_dir.exists():
              shutil.rmtree(app_dir)
          app_dir.mkdir(parents=True)
          compressed_app = gzip.compress(html.encode('utf-8'), compresslevel=9, mtime=0)
          encoded_app = base64.b64encode(compressed_app).decode('ascii')
          chunk_size = 180_000
          app_chunks = [encoded_app[i:i + chunk_size] for i in range(0, len(encoded_app), chunk_size)]
          for index, chunk in enumerate(app_chunks, 1):
              (app_dir / f'part-{index:03d}.b64').write_text(chunk, encoding='utf-8')

          app_manifest = {
              'version': app_version,
              'count': len(app_chunks),
              'base64Characters': len(encoded_app),
              'compressedBytes': len(compressed_app),
              'htmlCharacters': len(html),
              'sha256': hashlib.sha256(html.encode('utf-8')).hexdigest(),
          }
          (app_dir / 'manifest.json').write_text(json.dumps(app_manifest, indent=2), encoding='utf-8')

          loader = f'''<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Trafalgar Sky 2</title><style>html,body{{margin:0;min-height:100%;background:#07111f;color:#eef4fb;font-family:system-ui,sans-serif}}body{{display:grid;place-items:center}}main{{text-align:center;padding:2rem}}.spinner{{width:42px;height:42px;margin:0 auto 1rem;border:4px solid #ffffff2b;border-top-color:#79b8ff;border-radius:50%;animation:s 1s linear infinite}}@keyframes s{{to{{transform:rotate(360deg)}}}}small{{color:#a9b7c9}}</style></head><body><main><div class="spinner"></div><div>Loading Trafalgar Sky 2…</div><small>Preparing the detailed interactive scene…</small></main><script>
(async()=>{{
 if(!('DecompressionStream' in window))throw new Error('Please use a current version of Chrome, Edge, Firefox or Safari.');
 const base='{app_dir.as_posix()}/',count={len(app_chunks)},parts=new Array(count),queue=Array.from({{length:count}},(_,i)=>i);
 await Promise.all(Array.from({{length:Math.min(4,count)}},async()=>{{while(queue.length){{const i=queue.shift(),r=await fetch(`${{base}}part-${{String(i+1).padStart(3,'0')}}.b64?v={app_version}`,{{cache:'no-store'}});if(!r.ok)throw new Error(`Unable to load application part ${{i+1}}.`);parts[i]=(await r.text()).trim();}}}}));
 const encoded=parts.join('');if(!encoded||encoded.length%4)throw new Error('The application payload did not load completely.');
 const binary=atob(encoded),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const appHtml=await new Response(stream).text();document.open();document.write(appHtml);document.close();
}})().catch(error=>{{document.body.innerHTML=`<main><h1>Unable to load Trafalgar Sky 2</h1><p>${{String(error.message||error)}}</p><button onclick="location.reload()">Reload</button></main>`;}});
</script></body></html>'''
          Path('moon2.html').write_text(loader, encoding='utf-8')

          validation = {
              'ok': True,
              'model': {
                  'compressedBytes': len(compressed_model),
                  'compressedSha256': hashlib.sha256(compressed_model).hexdigest(),
                  'uncompressedBytes': len(raw_model),
                  'uncompressedSha256': hashlib.sha256(raw_model).hexdigest(),
                  'magic': raw_model[:8].decode('ascii'),
                  'faces': header.get('faces'),
                  'vertices': header.get('vertices'),
                  'chunks': len(header.get('chunks', [])),
                  'materials': len(header.get('materials', [])),
                  'parts': part_report,
              },
              'app': app_manifest,
          }
          Path('moon2-model-validation.json').write_text(json.dumps(validation, indent=2), encoding='utf-8')
          print(json.dumps(validation, indent=2))
          PY

      - name: Commit clean app build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moon2.html moon2-app19-direct-v19 moon2-model-validation.json
          if git diff --cached --quiet; then
            echo "Clean build already current."
          else
            git commit -m "Build Moon2 with direct verified model assets"
            git push origin master
          fi
