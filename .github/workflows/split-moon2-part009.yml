name: Split Moon2 model part 009

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/split-moon2-part009.yml
      - moon2-model18-c98efce62cd7/part-009.b64

permissions:
  contents: write

jobs:
  split-model-part:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Split oversized Base64 file
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import shutil

          source_path = Path('moon2-model18-c98efce62cd7/part-009.b64')
          output_dir = Path('moon2-model18-part009-split-v1')
          text = source_path.read_text(encoding='utf-8').strip()

          # Base64 is reconstructed by concatenation, but using a multiple of 4
          # also leaves each intermediate piece syntactically well-formed.
          chunk_size = 240_000
          chunks = [text[i:i + chunk_size] for i in range(0, len(text), chunk_size)]

          if output_dir.exists():
              shutil.rmtree(output_dir)
          output_dir.mkdir(parents=True)

          for index, chunk in enumerate(chunks, 1):
              (output_dir / f'part-{index:03d}.b64').write_text(chunk, encoding='utf-8')

          manifest = {
              'count': len(chunks),
              'totalCharacters': len(text),
              'sha256': hashlib.sha256(text.encode('ascii')).hexdigest(),
              'chunkSize': chunk_size,
          }
          (output_dir / 'manifest.json').write_text(
              json.dumps(manifest, separators=(',', ':')),
              encoding='utf-8',
          )
          print(manifest)
          PY

      - name: Commit generated chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moon2-model18-part009-split-v1
          if git diff --cached --quiet; then
            echo "Split files already up to date."
          else
            git commit -m "Split Moon2 model part 009 into browser-safe chunks"
            git push origin master
          fi
