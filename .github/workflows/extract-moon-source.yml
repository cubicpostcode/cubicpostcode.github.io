name: Extract Moon deployed source

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/extract-moon-source.yml
      - moon-assets-84339918/*.js

permissions:
  contents: write

jobs:
  extract-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Decode and decompress deployed app
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, gzip, base64, re

          base = Path('moon-assets-84339918')
          names = ['data-01.js','data-02.js','data-03a.js','data-03b.js','data-04.js','data-05.js','data-06.js','data-07.js','data-08a.js','data-08b.js','data-09.js']
          chunks=[]
          for name in names:
              text=(base/name).read_text(encoding='utf-8').strip()
              m=re.search(r"\+('(?:[^'\\]|\\.)*')\s*;?$", text, re.S)
              if not m:
                  raise RuntimeError(f'Cannot parse {name}')
              chunks.append(ast.literal_eval(m.group(1)))
          encoded=''.join(chunks)
          html=gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          Path('moon-debug-source.html').write_text(html,encoding='utf-8')
          print(f'Extracted {len(html):,} characters')
          PY
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moon-debug-source.html
          if git diff --cached --quiet; then
            echo "Source already current."
          else
            git commit -m "Extract Moon deployed app source"
            git push origin master
          fi
